<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小水滴 Little Drop：在手機桌面保留提醒、目標與每天想記住的事。">
  <title>小水滴 Little Drop</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #e9f7ff, #eef0ff 55%, #fff1fb); color: #14294a; }
    main { width: min(680px, calc(100% - 48px)); padding: 52px 32px; text-align: center; }
    .drop { font-size: 3.25rem; line-height: 1; } h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 14px 0; }
    p { font-size: 1.12rem; line-height: 1.75; color: #435a78; } a { color: #0878e8; font-weight: 700; }
    .card { margin-top: 30px; padding: 24px; border: 1px solid #cce6ff; border-radius: 24px; background: rgba(255,255,255,.78); box-shadow: 0 16px 44px rgba(30,100,180,.12); }
  </style>
</head>
<body>
  <main>
    <div class="drop" aria-hidden="true">💧</div>
    <h1>小水滴 Little Drop</h1>
    <p>將提醒、人生目標與每天想記住的事，放在手機桌面隨時看見。</p>
    <section class="card">
      <p><strong>提醒與鼓勵・目標與進度・桌面小工具</strong></p>
      <p><a href="https://play.google.com/store/apps/details?id=com.littledrop.app">在 Google Play 下載</a></p>
    </section>
  </main>
</body>
</html>
